# Expose both USB audio playback interfaces on the Razer Kraken V4 Pro
# (Game = hw:X,0, Chat = hw:X,1) as separate always-on sinks, instead of
# ACP's mutually-exclusive analog-stereo/iec958-stereo profile switching.
monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x1532", device.product.id = "0x0568" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*Razer_Kraken_V4_Pro.*playback\\.0\\.0$" }
    ]
    actions = {
      update-props = {
        node.description = "Razer Kraken V4 Pro (Game)"
        node.nick        = "Razer Kraken V4 Pro (Game)"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*Razer_Kraken_V4_Pro.*playback\\.1\\.0$" }
    ]
    actions = {
      update-props = {
        node.description = "Razer Kraken V4 Pro (Chat)"
        node.nick        = "Razer Kraken V4 Pro (Chat)"
      }
    }
  }
]
